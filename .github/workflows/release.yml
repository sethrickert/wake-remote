name: Release
on: {push: {tags: ['v*']}}
permissions: {contents: write, packages: write}
jobs:
  artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Decode Android signing key
        shell: bash
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
        env: {ANDROID_KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'}
      - run: android/gradlew.bat -p android assembleRelease
        env: {WAKE_STORE_FILE: release.jks, WAKE_STORE_PASSWORD: '${{ secrets.ANDROID_STORE_PASSWORD }}', WAKE_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}', WAKE_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'}
      - run: dotnet publish windows/WakeRemote/WakeRemote.csproj -c Release
      - uses: crazy-max/ghaction-chocolatey@v3
        with: {args: install innosetup --yes}
      - run: iscc windows/installer.iss
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install && npm run build
        working-directory: pwa
      - run: Compress-Archive pwa/dist/* WakeRemote-PWA.zip
      - uses: softprops/action-gh-release@v2
        with: {files: |
            android/app/build/outputs/apk/release/*.apk
            windows/WakeRemote/bin/Release/net8.0-windows/win-x64/publish/WakeRemote.exe
            windows/artifacts/*.exe
            WakeRemote-PWA.zip}
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with: {context: server, platforms: 'linux/amd64,linux/arm64', push: true, tags: 'ghcr.io/sethrickert/wake-remote-server:${{ github.ref_name }}'}
