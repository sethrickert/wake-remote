name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: PYTHONPATH=server python -m unittest discover -s server/tests
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew test lint assembleDebug --no-daemon
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet test windows/WakeRemote.Tests/WakeRemote.Tests.csproj
      - run: dotnet publish windows/WakeRemote/WakeRemote.csproj -c Release
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: pwa/package-lock.json}
      - run: npm install
        working-directory: pwa
      - run: npm test && npm run lint && npm run build
        working-directory: pwa
